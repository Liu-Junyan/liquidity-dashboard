name: Build and deploy dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Audit each input commit, including changes hidden by later commits.
          fetch-depth: 0
          # A synthetic PR merge has no maintainer-authored correction message.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Build dashboard from registry
        run: python scripts/build.py --mode demo
      - name: Verify data and calculations
        run: |
          python scripts/registry.py
          python scripts/policies.py
          python scripts/import_manual.py
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/data.test.mjs
          python scripts/build.py --mode preview
          node --test tests/preview.test.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
